# The awesome-humans.net documentation site. scripts/build-site.cs stages this file into
# site/build with the navigation added, beside the pages it generates, so build from there:
#
#     dotnet run scripts/build-site.cs
#     uvx --with-requirements site/requirements.txt zensical build --strict -f site/build/zensical.toml
#
# docs_dir and site_dir are relative to the staged copy. Each ecosystem lives under its own
# path, /dotnet/ for this repository, so the URLs stay put when the site moves to a shared
# awesome-humans repository and more ecosystems join it.

[project]
site_name = "Awesome Humans"
site_description = "What good looks like in each ecosystem, distilled from people with a proven track record of writing about it."
site_url = "https://awesome-humans.net/"
repo_url = "https://github.com/si618/dotnet-awesome-humans"
repo_name = "si618/dotnet-awesome-humans"
docs_dir = "docs"
site_dir = "public"

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Light and dark mode, defaulting to the reader's system preference, with a toggle that
# cycles through system, light and dark. Teal matches the diagrams' accent.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
