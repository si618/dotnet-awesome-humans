<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 440"><title id="title">Source standing</title><desc id="desc">Flow diagram: vet-source sorts a candidate source into citable, with two years of writing and all four criteria; the watch list, under two years or dormant; or declined. A citable source is unmarked, marked Corroborate and never the only citation on a claim, or marked Discovery-only and never cited. Citable and watch-listed sources go back through vet-source when they go dormant, drop in quality, or clear a blocker.</desc><style>
svg { --bg: #f5f6f8; --surface: #ffffff; --band: #eceef2; --fg: #16181d; --muted: #5b6170; --line: #bcc1cc;
  --accent: #512bd4; --human: #b4534f; --auto: #1d4ed8;
  --sources: #0f766e; --research: #0369a1; --opinions: #512bd4; --reports: #b45309;
  --sans: "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
@media (prefers-color-scheme: dark) { svg { --bg: #0f1115; --surface: #171a21; --band: #1e222b; --fg: #e6e8ee; --muted: #9aa1b2; --line: #3a404d;
  --accent: #a08cf0; --human: #e8948f; --auto: #60a5fa;
  --sources: #2dd4bf; --research: #38bdf8; --opinions: #a08cf0; --reports: #fbbf24; } }

.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font: 500 12.5px var(--sans); }
.tb { fill: var(--fg); font: 600 14px var(--sans); letter-spacing: .02em; }
.tm { fill: var(--fg); font: 600 12.5px var(--mono); }
.ts { fill: var(--muted); font: 400 11.5px var(--sans); }
.th { fill: var(--muted); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font: 600 11.5px var(--sans); }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font: 600 11.5px var(--sans); }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1220" height="440" rx="10" class="bg"/><rect x="24" y="150" width="196" height="64" rx="8" class="box"/><text x="40" y="179" class="tb" text-anchor="start">Candidate source</text><text x="40" y="197" class="ts" text-anchor="start">blog, docs, book, newsletter</text><line x1="220" y1="182" x2="262" y2="182" class="edge" marker-end="url(#ah)"/><path d="M300 146L336 182L300 218L264 182z" class="decision"/><text x="300" y="134" class="tm" text-anchor="middle">vet-source</text><text x="300" y="186" class="ts" text-anchor="middle">criteria</text><line x1="336" y1="182" x2="368" y2="182" class="edge"/><rect x="580" y="24" width="500" height="196" rx="8" class="box"/><rect x="580" y="24" width="4" height="196" rx="2" fill="var(--accent)"/><text x="596" y="50" class="tb" text-anchor="start">Citable</text><text x="596" y="68" class="ts" text-anchor="start">quotable in opinions and templates, within its marking</text><rect x="596" y="84" width="468" height="36" rx="6" class="chip"/><text x="608" y="107" class="tm" text-anchor="start">unmarked</text><text x="776" y="107" class="t" text-anchor="start">may carry a claim alone</text><rect x="596" y="128" width="468" height="36" rx="6" class="chip"/><text x="608" y="151" class="tm" text-anchor="start">**Corroborate.**</text><text x="776" y="151" class="t" text-anchor="start">cited, never as the only source on a claim</text><rect x="596" y="172" width="468" height="36" rx="6" class="chip"/><text x="608" y="195" class="tm" text-anchor="start">**Discovery-only.**</text><text x="776" y="195" class="t" text-anchor="start">never cited, only followed to its primary source</text><rect x="580" y="244" width="500" height="56" rx="8" class="ext"/><text x="596" y="269" class="tb" text-anchor="start">Watch list</text><text x="596" y="287" class="ts" text-anchor="start">leads only, never cited</text><rect x="580" y="324" width="500" height="56" rx="8" class="ext"/><text x="596" y="349" class="tb" text-anchor="start">Declined</text><text x="596" y="367" class="ts" text-anchor="start">off the roster, the decision logged</text><path d="M368 182V56H578" class="edge" marker-end="url(#ah)"/><text x="380" y="48" class="ts" text-anchor="start">two years and all four criteria</text><path d="M368 182V272H578" class="edge" marker-end="url(#ah)"/><text x="380" y="264" class="ts" text-anchor="start">under two years, or dormant</text><path d="M368 182V352H578" class="edge" marker-end="url(#ah)"/><text x="380" y="344" class="ts" text-anchor="start">otherwise</text><path d="M1080 56H1196V412" class="edge dash"/><path d="M1080 272H1196" class="edge dash"/><path d="M1196 412H300V220" class="edge dash" marker-end="url(#ah)"/><text x="1090" y="48" class="ts" text-anchor="start">dormant, weaker</text><text x="1090" y="264" class="ts" text-anchor="start">blocker clears</text><text x="748" y="404" class="ts" text-anchor="middle">re-vetted: standing is never permanent</text></svg>
