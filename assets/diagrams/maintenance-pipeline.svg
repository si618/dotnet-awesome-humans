<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 736"><title id="title">Maintenance pipeline</title><desc id="desc">Swimlane diagram of how this repository maintains itself: vet-source, research-topic, resolve-research, harvest-sources, refresh-dotnet-versions and weave-house-opinion each work on their own branch, pass CI and the owner's review, and land in the roster, research/ or the opinions and templates; audit-freshness and verify-project only report. Their findings, the release watch and the harvest reminder start the next run.</desc><style>
svg { --bg: #f5f6f8; --surface: #ffffff; --band: #eceef2; --fg: #16181d; --muted: #5b6170; --line: #bcc1cc;
  --accent: #512bd4; --human: #b4534f; --auto: #1d4ed8;
  --sources: #0f766e; --research: #0369a1; --opinions: #512bd4; --reports: #b45309;
  --sans: "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
@media (prefers-color-scheme: dark) { svg { --bg: #0f1115; --surface: #171a21; --band: #1e222b; --fg: #e6e8ee; --muted: #9aa1b2; --line: #3a404d;
  --accent: #a08cf0; --human: #e8948f; --auto: #60a5fa;
  --sources: #2dd4bf; --research: #38bdf8; --opinions: #a08cf0; --reports: #fbbf24; } }

.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font: 500 12.5px var(--sans); }
.tb { fill: var(--fg); font: 600 14px var(--sans); letter-spacing: .02em; }
.tm { fill: var(--fg); font: 600 12.5px var(--mono); }
.ts { fill: var(--muted); font: 400 11.5px var(--sans); }
.th { fill: var(--muted); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font: 600 11.5px var(--sans); }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font: 600 11.5px var(--sans); }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

