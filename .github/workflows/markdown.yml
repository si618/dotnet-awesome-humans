name: Markdown

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC — the link check needs to run on a cadence, not
    # only on PRs: links rot while the repository sits still.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  format-and-lint:
    # Formatting and structure are deterministic and offline — they gate PRs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      # ci install, not npm install: it honours package-lock.json exactly and
      # fails if the lock and manifest disagree, so CI cannot float a version.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint markdown
        run: npm run lint

  links:
    runs-on: ubuntu-latest
    # Non-blocking on PRs only: a third-party host being down is not a defect in
    # the PR. On the weekly run it must be allowed to fail, or link rot — the
    # entire reason for the cron — would be reported as a green run, and
    # audit-freshness reads this workflow's result as its link-health signal.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Restore lychee's result cache so a run does not re-hit every host cold.
      # The action has no cache input of its own — this is the supported way.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress --cache --max-cache-age 1d .
          fail: true
