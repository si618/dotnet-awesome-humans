name: Harvest reminder

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open harvest reminder issue (skip if one already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          title="Harvest due: $(date -u '+%B %Y')"

          existing=$(gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title' \
            | grep -Fxc "$title" || true)
          if [ "${existing:-0}" -gt 0 ]; then
            echo "Open issue titled '$title' already exists — skipping."
            exit 0
          fi

          url="https://github.com/${GH_REPO}/blob/main"
          body=$(cat <<EOF
          It is time for the monthly source harvest.

          Run the [\`harvest-sources\` skill](${url}/skills/harvest-sources/SKILL.md) to sweep the vetted sources in AWESOME-HUMANS.md for new posts and fold notable guidance into the opinion files.

          The date of the last harvest is recorded in the decision log in [AWESOME-HUMANS.md](${url}/AWESOME-HUMANS.md).
          EOF
          )

          gh issue create --title "$title" --body "$body"
