name: Validate skills and opinions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Set explicitly rather than inherited: the GitHub runner image puts NOLOGO in
# /etc/environment but only exports the telemetry opt-out while installing the SDK,
# so a job gets the quiet banner and the phone-home. Declaring both here also means
# a self-hosted runner behaves the same as a GitHub-hosted one.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Python only for skills-ref: the Agent Skills specification's own reference
      # validator, published only to PyPI.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install skills-ref
        run: pip install -r .github/requirements.txt

      # global.json decides the SDK, per opinions/ci.md — CI must not float a version
      # the repository did not choose.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate skills against the Agent Skills spec
        run: |
          set -u
          status=0
          found=0
          for dir in skills/*/; do
            found=1
            if ! agentskills validate "$dir"; then
              status=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No skill directories found under skills/" >&2
            status=1
          fi
          exit "$status"

      - name: Verify opinions frontmatter
        run: dotnet run scripts/validate-opinion-frontmatter.cs

      - name: Verify opinion sources against the roster
        run: dotnet run scripts/validate-opinion-sources.cs

      - name: Verify README indexes every opinion and skill
        run: dotnet run scripts/validate-readme-index.cs
